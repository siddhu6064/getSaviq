name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y libmagic1

      - name: Install backend test dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run backend pytest suite
        run: pytest tests/backend -q

  web-unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Run web unit tests
        run: npm --prefix web run test

  mobile-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install mobile dependencies
        run: npm --prefix frontend ci

      - name: Type-check mobile app
        run: npm --prefix frontend run typecheck

      - name: Run mobile unit tests
        run: npm --prefix frontend run test

  playwright-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Playwright test dependency
        run: npm install

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Build web app
        run: npm --prefix web run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run e2e suite
        run: npx playwright test tests/e2e/ --config=playwright.config.ts
